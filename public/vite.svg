<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Shape -->
  <rect x="10" y="10" width="80" height="80" rx="24" fill="url(#grad)" />
  
  <!-- Book/Brain Icon -->
  <g fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 40 C 30 30, 50 30, 50 40 C 50 30, 70 30, 70 40 V 70 C 70 60, 50 60, 50 70 C 50 60, 30 60, 30 70 Z" />
    <line x1="50" y1="40" x2="50" y2="70" />
    <!-- AI Spark -->
    <path d="M70 25 L 75 35 L 65 35 Z" fill="white" stroke="none" />
    <circle cx="70" cy="25" r="2" fill="white" stroke="none"/>
  </g>
</svg>